baseURL = "https://criscornea.github.io/static_studio_web/"
languageCode = "en-us"
title = "Static Studio"
disableKinds = ["taxonomy", "term", "RSS", "sitemap"]

[params]
  description = "A local editor for Hugo sites: content tree, frontmatter forms, Markdown with live preview, build, serve and publish."
  author = "Static Studio"
  license = "MIT"
  github = "https://github.com/criscornea/static_studio"
  docs = "[DOCS URL]"
  changelog = "[CHANGELOG URL]"
  issues = "https://github.com/criscornea/static_studio/issues"
  releases = "https://github.com/criscornea/static_studio/releases"
  goModule = "github.com/criscornea/static_studio/cmd/studio"
  publishTarget = "[YOUR PUBLISH TARGET]"

  [params.downloads]
    macosArm = "https://github.com/criscornea/static_studio/releases"
    macosIntel = "https://github.com/criscornea/static_studio/releases"
    windows = "https://github.com/criscornea/static_studio/releases"
    linux = "https://github.com/criscornea/static_studio/releases"

[menu]
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menu.main]]
    identifier = "changelog"
    name = "Changelog"
    url = "/changelog/"
    weight = 20
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/criscornea/static_studio"
    weight = 30
