{{ define "main" }}
<article class="doc container">
  <header class="doc-head">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}<p class="lead">{{ . }}</p>{{ end }}
  </header>
  <div class="doc-body">
    {{ .Content }}
  </div>
  {{ with .Pages.ByWeight }}
  <ul class="doc-list">
    {{ range . }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Params.description }}<p>{{ . }}</p>{{ end }}
    </li>
    {{ end }}
  </ul>
  {{ end }}
</article>
{{ end }}
